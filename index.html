<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Peristaltic Queue Architecture</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@100;400;700&display=swap');

        :root {
            --bg: #070709;
            --panel: #111115;
            --border: rgba(255, 255, 255, 0.1);
            --text-main: #e0e0e0;
            --text-muted: #666;
            --accent: #00ffcc;
            --warning: #ffaa00;
            --font: 'JetBrains Mono', monospace;
        }

        body, html {
            margin: 0; padding: 0;
            background-color: var(--bg);
            color: var(--text-main);
            font-family: var(--font);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Top Telemetry HUD */
        header {
            display: flex;
            justify-content: space-between;
            padding: 15px 30px;
            border-bottom: 1px solid var(--border);
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            background: var(--panel);
        }

        .metric { display: flex; gap: 15px; }
        .metric span { color: var(--accent); font-weight: bold; }
        .metric.warning span { color: var(--warning); }

        /* Main Dashboard Layout */
        main {
            display: grid;
            grid-template-columns: 1fr 350px;
            flex-grow: 1;
        }

        /* Left Side: Visualizer & Video */
        .viewport {
            display: flex;
            flex-direction: column;
            border-right: 1px solid var(--border);
        }

        /* Clean, non-weird Pipeline Visualizer */
        .pipeline-container {
            flex: 1;
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            border-bottom: 1px solid var(--border);
            background: radial-gradient(circle at center, #1a1a24 0%, var(--bg) 100%);
        }

        .pipeline-title {
            font-size: 10px;
            color: var(--text-muted);
            margin-bottom: 20px;
            text-transform: uppercase;
        }

        .nodes {
            display: flex;
            gap: 15px;
            align-items: center;
            justify-content: space-between;
        }

        .node {
            flex: 1;
            height: 80px;
            border: 1px dashed var(--border);
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            background: rgba(0,0,0,0.3);
            transition: all 0.2s ease;
        }

        .node-label {
            position: absolute;
            top: -25px;
            font-size: 10px;
            color: var(--text-muted);
        }

        .data-packet {
            width: 90%;
            height: 40px;
            background: rgba(0, 255, 204, 0.1);
            border: 1px solid var(--accent);
            opacity: 0.2;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            color: var(--accent);
        }

        /* Animation States for Packets */
        .node.active .data-packet {
            opacity: 1;
            width: 60%; /* Represents biological compression/data squeeze */
            background: rgba(0, 255, 204, 0.2);
        }

        .node.locked { border-color: var(--accent); }
        .node.backpressure .data-packet {
            background: rgba(255, 170, 0, 0.2);
            border-color: var(--warning);
            color: var(--warning);
            width: 95%; /* Swells up due to pressure */
        }

        /* Video Container */
        .video-container {
            flex: 1.5;
            position: relative;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            transition: filter 0.3s;
        }

        video.lagging {
            filter: grayscale(80%) contrast(120%);
        }

        /* Right Side: Controls */
        .controls-panel {
            padding: 30px;
            background: var(--panel);
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .control-group label {
            font-size: 11px;
            color: var(--text-muted);
            text-transform: uppercase;
            display: flex;
            justify-content: space-between;
        }

        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
        }

        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 2px;
            background: var(--border);
        }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 14px;
            width: 7px;
            background: var(--accent);
            margin-top: -6px;
            cursor: pointer;
        }

        button {
            background: transparent;
            color: var(--text-main);
            border: 1px solid var(--border);
            padding: 15px;
            font-family: var(--font);
            font-size: 12px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.2s;
        }

        button:hover { background: rgba(255,255,255,0.05); }
        
        #btn-obstacle { border-color: var(--warning); color: var(--warning); }
        #btn-obstacle:active { background: rgba(255, 170, 0, 0.2); }
        #btn-obstacle.active-bp { background: var(--warning); color: #000; font-weight: bold; }

        #btn-reset { border-color: var(--accent); color: var(--accent); margin-top: auto;}
        #btn-reset:active { background: rgba(0, 255, 204, 0.2); }

    </style>
</head>
<body>

    <header>
        <div>PERISTALTIC QUEUE ENGINE // LIVE POC</div>
        <div class="metric" id="status-hud">STATUS: <span>NOMINAL</span></div>
        <div class="metric">PLAYBACK RATE: <span id="rate-val">1.0x</span></div>
        <div class="metric">OFFSET COMMITS: <span id="offset-val">0x0000</span></div>
    </header>

    <main>
        <div class="viewport">
            <!-- Clean Data Pipeline Visualization -->
            <div class="pipeline-container">
                <div class="pipeline-title">Logical Topology: Asynchronous Checkpoint Nodes</div>
                <div class="nodes" id="pipeline-nodes">
                    <div class="node" id="n1"><div class="node-label">N1: INGEST</div><div class="data-packet">EMPTY</div></div>
                    <div class="node" id="n2"><div class="node-label">N2: COMPRESS</div><div class="data-packet">EMPTY</div></div>
                    <div class="node" id="n3"><div class="node-label">N3: WAL COMMIT</div><div class="data-packet">EMPTY</div></div>
                    <div class="node" id="n4"><div class="node-label">N4: TRANSIT</div><div class="data-packet">EMPTY</div></div>
                    <div class="node" id="n5"><div class="node-label">N5: RENDER</div><div class="data-packet">EMPTY</div></div>
                </div>
            </div>

            <!-- Video Stream Representation -->
            <div class="video-container">
                <!-- Replace 'demo_video.mp4' with the actual filename of your video -->
                <video id="stream-video" src="demo_video.mp4" autoplay loop muted></video>
            </div>
        </div>

        <div class="controls-panel">
            <div class="control-group">
                <label>Stream Cadence (Hz) <span id="val-cadence">1.0</span></label>
                <input type="range" id="slider-cadence" min="0.1" max="2.0" step="0.1" value="1.0">
            </div>

            <div class="control-group">
                <label>Network Friction (ms) <span id="val-friction">0</span></label>
                <input type="range" id="slider-friction" min="0" max="100" step="1" value="0">
            </div>

            <button id="btn-obstacle">Simulate Backpressure (Hold)</button>

            <button id="btn-reset">Reset System</button>
        </div>
    </main>

    <script>
        // System Variables
        const video = document.getElementById('stream-video');
        const sliderCadence = document.getElementById('slider-cadence');
        const sliderFriction = document.getElementById('slider-friction');
        const btnObstacle = document.getElementById('btn-obstacle');
        const btnReset = document.getElementById('btn-reset');
        
        let isBackpressure = false;
        let pipelineStep = 0;
        let offsetCount = 0;

        // UI Updaters
        function updateSystem() {
            let cadence = parseFloat(sliderCadence.value);
            let friction = parseInt(sliderFriction.value);
            
            document.getElementById('val-cadence').innerText = cadence.toFixed(1);
            document.getElementById('val-friction').innerText = friction;

            // Calculate reactive playback speed
            // Baseline is cadence. Friction reduces it. Backpressure crushes it to simulate buffering.
            let targetRate = cadence - (friction / 200);
            
            if (isBackpressure) {
                targetRate = targetRate * 0.1; // extreme slow down
                document.getElementById('status-hud').innerHTML = 'STATUS: <span>HYDROSTATIC BACKPRESSURE</span>';
                document.getElementById('status-hud').classList.add('warning');
                video.classList.add('lagging');
            } else {
                document.getElementById('status-hud').innerHTML = 'STATUS: <span>NOMINAL</span>';
                document.getElementById('status-hud').classList.remove('warning');
                video.classList.remove('lagging');
            }

            // Clamp rate between 0.05 and 2.5
            targetRate = Math.max(0.05, Math.min(2.5, targetRate));
            video.playbackRate = targetRate;
            
            document.getElementById('rate-val').innerText = targetRate.toFixed(2) + 'x';
        }

        // Event Listeners
        sliderCadence.addEventListener('input', updateSystem);
        sliderFriction.addEventListener('input', updateSystem);

        // Backpressure Button (Press and hold behavior)
        btnObstacle.addEventListener('mousedown', () => { isBackpressure = true; btnObstacle.classList.add('active-bp'); updateSystem(); });
        btnObstacle.addEventListener('mouseup', () => { isBackpressure = false; btnObstacle.classList.remove('active-bp'); updateSystem(); });
        btnObstacle.addEventListener('mouseleave', () => { isBackpressure = false; btnObstacle.classList.remove('active-bp'); updateSystem(); });

        // Reset Button
        btnReset.addEventListener('click', () => {
            sliderCadence.value = 1.0;
            sliderFriction.value = 0;
            isBackpressure = false;
            updateSystem();
        });

        // Visual Pipeline Loop (Simulating the peristaltic wave)
        setInterval(() => {
            // Get nodes
            const nodes = [
                document.getElementById('n1'),
                document.getElementById('n2'),
                document.getElementById('n3'),
                document.getElementById('n4'),
                document.getElementById('n5')
            ];

            // Clear previous states
            nodes.forEach(n => {
                n.className = 'node';
                n.querySelector('.data-packet').innerText = 'WAITING';
            });

            // If backpressure, visually stack chunks up at the beginning of the pipeline
            if (isBackpressure) {
                nodes[0].className = 'node active backpressure';
                nodes[0].querySelector('.data-packet').innerText = '[ BLOCKED ]';
                nodes[1].className = 'node active backpressure';
                nodes[1].querySelector('.data-packet').innerText = '[ BLOCKED ]';
            } else {
                // Normal propagating wave
                let activeNode = nodes[pipelineStep % 5];
                activeNode.className = 'node active locked';
                
                // This represents the "Proleg Checkpoint"
                activeNode.querySelector('.data-packet').innerText = '[ 🔒 ACK ]'; 

                // Increment hex offset to look cool and technical
                offsetCount += 16;
                document.getElementById('offset-val').innerText = '0x' + offsetCount.toString(16).toUpperCase().padStart(4, '0');
            }

            // Advance wave speed based on variables
            let speedMod = isBackpressure ? 0 : parseFloat(sliderCadence.value);
            if(speedMod > 0) pipelineStep++;

        }, 400); // Base tick rate

        // Init
        updateSystem();
    </script>
</body>
</html>
